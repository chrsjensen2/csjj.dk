<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Link preview image</title>
<!--
  Source for ../og-image.jpg, the image shown when csjj.dk is shared.
  Edit this file, then screenshot it at exactly 1200x630 (Playwright:
  viewport 1200x630, page.screenshot()) and save over ../og-image.jpg (JPEG, quality 88).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--card:#111111;--line:#232323;--text:#f2f2f2;--muted:#9a9a9a;--accent:#3ee08f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--bg)}
body{position:relative;font-family:"Space Grotesk",system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(700px 480px at -8% 112%,rgba(62,224,143,.18),transparent 62%)}
.photo{position:absolute;top:0;right:0;width:560px;height:630px;background:url(../Photo_cv.jpg) center 18%/cover no-repeat}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,rgba(5,5,5,.75) 18%,rgba(5,5,5,0) 48%)}
.copy{position:absolute;left:72px;top:72px;bottom:64px;width:640px;display:flex;flex-direction:column}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:20px;color:#d6d6d6}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(62,224,143,.15)}
h1{margin-top:44px;font-size:60px;line-height:1.08;font-weight:600;letter-spacing:-1.4px;white-space:nowrap}
.role{margin-top:14px;font-size:32px;font-weight:500;color:var(--accent);letter-spacing:-.3px}
.tag{margin-top:26px;font-size:25px;line-height:1.45;color:#bdbdbd;max-width:560px}
.foot{margin-top:auto;display:flex;align-items:center;gap:14px;font-size:24px;font-weight:500;color:var(--text)}
.foot img{width:40px;height:40px;display:block}
.foot span{color:var(--muted);font-weight:400}
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="copy">
    <div class="badge"><span class="dot"></span>Open to new roles</div>
    <h1>Christian S. J. Jensen</h1>
    <div class="role">Product &amp; Delivery Lead</div>
    <p class="tag">From wireframe to launch, on time. 15+ years taking digital products from zero to launch.</p>
    <div class="foot"><img src="../favicon.svg" alt="">csjj.dk <span>· Mexico City</span></div>
  </div>
</body>
</html>
